[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concord-repro"
version = "0.1.0"
description = "Reproducible reference implementation of CONCORD"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "einops>=0.7",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
concord = "concord.cli:main"

[tool.setuptools]
package-dir = {"concord" = "src"}
packages = [
  "concord",
  "concord.data",
  "concord.models",
  "concord.training",
  "concord.utils",
]
